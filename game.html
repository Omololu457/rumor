<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Rumor</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="phase-lobby" id="body">
  <div class="wrap">
    <div class="eyebrow" id="eyebrow">Round --</div>
    <h1><span class="bulb"></span><span id="phase-title">Loading&hellip;</span></h1>

    <div id="timer-block" style="display:none;">
      <div class="timer" id="timer">--</div>
      <div class="timer-label" id="timer-label"></div>
    </div>

    <div id="objective-block"></div>
    <div id="host-block"></div>
    <div id="main-block"></div>
    <div id="players-block"></div>
  </div>

  <script>
    window.PLAYER_ID = {{ player_id | tojson }};
  </script>
  <script src="/static/js/app.js"></script>
</body>
</html>
